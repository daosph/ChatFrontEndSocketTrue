<h2 mat-dialog-title>Create User</h2>

<mat-dialog-content>
  <form [formGroup]="formPerson">
  <div class="input-group">
    <label for="user">Enter a name </label>
    <input type="text" id="name" formControlName="name" name="name" placeholder="Enter your name">
  </div>

  <div class="input-group">
    <label for="user">Enter a last name</label>
    <input type="text" id="lastName" formControlName="lastName" name="lastName" placeholder="Enter your last name">
  </div>

  <div class="input-group">
    <label for="user">Enter a phone</label>
    <input type="text" id="telephone" formControlName="telephone" name="telephone" placeholder="Enter your phone" maxlength="15">
  </div>


  <div class="input-group">
    <label for="user">Enter a username</label>
    <input type="text" id="user" formControlName="user" name="user" placeholder="Enter your user">
  </div>

 

  <div class="input-group">
    <label for="user">Enter a password</label>
    <input type="password" id="password" formControlName="password" name="password" placeholder="Enter your password">
  </div>

  <div class="select">
  <label for="select">Enter a group</label>
  <mat-form-field>
    <mat-label>Group</mat-label>
    <mat-select formControlName = "rol_id">
      <mat-option *ngFor="let rol of datos" [value]="rol.id">
        {{ rol.nombre }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>


</form>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button color="primary" (click)="enviarFormulario()">Create</button>
</mat-dialog-actions>
